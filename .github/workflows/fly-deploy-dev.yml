name: Fly Deploy
on:
  push:
    branches:
      - release/staging
      - release/production

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to staging
        if: github.ref == 'refs/heads/release/staging'
        run: flyctl deploy --remote-only --app divinity-bank-staging --config ./fly.staging.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}

      - name: Deploy to production
        if: github.ref == 'refs/heads/release/production'
        run: flyctl deploy --remote-only --app divinity-bank-production --config ./fly.production.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PRODUCTION }}